name: dense_reranker
embedding_model: BAAI/bge-base-en-v1.5
reranker_model: ms-marco-MiniLM-L-12-v2
llm_model: gemma2:9b
embedding_threads: 4
chunking:
  strategy: semantic_recursive
  chunk_size: 2048
  overlap: 128
retrieval:
  mode: dense
  rerank: true
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 20
  final_top_k: 10
  context_top_k: 5
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75
answerability:
  enabled: false
  threshold: null
  feature: top1
  calibration_file: null
generation:
  temperature: 0.0
  max_tokens: 192
  context_size: 4096
  seed: 42
  provider: ollama
  base_url: http://127.0.0.1:11434
  input_cost_per_million: null
  output_cost_per_million: null
